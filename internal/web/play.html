<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>搖搖競速</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;font-family:system-ui,sans-serif;background:#1e2a78;color:#fff;text-align:center}
h1{margin:0;font-size:28px}
input,button{font:inherit;font-size:22px;width:100%;max-width:320px;padding:14px;border-radius:12px;border:0}
input{text-align:center}
button{background:#ffcc00;color:#222;font-weight:700}
button:disabled{opacity:.5}
#msg{min-height:1.5em;font-size:18px}
#warn{color:#ffcc00;font-size:18px;font-weight:700}
#n{font-size:64px;font-weight:800;transition:transform .08s}
#n.p{transform:scale(1.25)}
#t{font-size:96px;font-weight:800;color:#ffcc00;min-height:0}
#mode{font-size:16px;opacity:.8}
.hide{display:none}
</style>
</head>
<body>
<h1>🏁 搖搖競速</h1>
<div id="form">
<p><input id="name" maxlength="8" placeholder="輸入暱稱（1–8 字）" autocomplete="off"></p>
<p><button id="go">準備</button></p>
</div>
<div id="t"></div>
<div id="n" class="hide">0</div>
<div id="msg"></div>
<div id="warn"></div>
<div id="mode"></div>
<script>
// K: shake-detector constants, injected by the server.
var K=__K__;
// The playerId and name are kept in localStorage, so a refresh, swipe-away
// or dropped connection rejoins as the same player (same score mid-race).
var $=function(i){return document.getElementById(i)},ws,ls={},joined=0,stop=0,prev=null;
try{ls=localStorage}catch(_){}
var me=ls.pid,nick=ls.nm;
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}
function say(t){$("msg").textContent=t}
function warn(t){$("warn").textContent=t}
function send(o){if(ws&&ws.readyState==1)ws.send(JSON.stringify(o))}
// end stops for good: full, kicked.
function end(t){stop=1;joined=0;if(R)clearInterval(R.iv);R=null;$("form").className="hide";$("n").className="hide";$("t").textContent="";$("mode").textContent="";say(t);ws.close()}
function connect(name){
  nick=name;stop=0;
  ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/ws/play");
  ws.onopen=function(){send({type:"join",name:name,playerId:me||undefined})};
  ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.type=="welcome"){me=m.playerId;store("pid",me);store("nm",nick);if(m.constants)K=m.constants;joined=1;if(arming)$("form").className="hide";$("n").className="";lobby()}
    else if(m.type=="error"){$("go").disabled=false;say(m.reason=="name"?"暱稱需為 1–8 個字":"發生錯誤");stop=1;ws.close()}
    else if(m.type=="full")end("本場已滿");
    else if(m.type=="kicked"){me=null;store("pid");end("已被移出")}
    else if(m.type=="wait"){if(R){clearInterval(R.iv);R=null}$("t").textContent="";say("下一場開放加入，請稍候…")}
    else if(m.type=="ping")send({type:"pong",id:m.id,clientTs:Date.now()});
    else if(m.type=="config"){cfg=m;if(R){clearInterval(R.iv);prev=R;R=null}lobby()}
    else if(m.type=="countdown")begin(m);
    else if(m.type=="end"&&R&&!R.res){if(!R.lock)say((R.T?"結束":"時間到")+"！結算中…");R.lock=1}
    else if(m.type=="result"&&R){R.res=1;R.lock=1;clearInterval(R.iv);$("t").textContent=m.finished?sec(m.elapsedMs):"";$("n").textContent=m.totalShakes;say("第 "+m.rank+" 名／共 "+m.players+" 人");vib([100,60,100])}
  };
  // Reconnect after a drop, unless told to stop.
  ws.onclose=function(){if(stop)return;if(joined)say("連線中斷，重新連線中…");joined=0;setTimeout(function(){if(!stop)connect(nick)},1000)};
}

// Shake detector. Primary rule: |acceleration| >= K.accel. Fallback when
// gravity-free acceleration is null: change in |accelerationIncludingGravity|
// between readings >= K.delta. A crossing disarms the detector; it re-arms
// once the signal drops below K.rearm x threshold. Counted shakes are at
// least K.cooldownMs apart.
var armed=1,last=-1e9,prevG=null,seen=0,count=0,lastWarm=0;
function mag(v){return v&&v.x!=null?Math.hypot(v.x,v.y||0,v.z||0):null}
function onMotion(e){
  var t=e.timeStamp||performance.now(),v=mag(e.acceleration),T=K.accel;
  if(v==null){
    var g=mag(e.accelerationIncludingGravity);
    if(g==null)return;
    v=prevG==null?0:Math.abs(g-prevG);prevG=g;T=K.delta;
  }
  if(!seen){seen=1;warn("")}
  if(armed&&v>=T){armed=0;if(t-last>=K.cooldownMs){last=t;shake()}}
  else if(!armed&&v<T*K.rearm)armed=1;
}
function shake(){
  var n=$("n");
  if(R){
    // Racing: count only inside [start, start+duration) on this phone's
    // clock. In a race, reaching the target is the finish: its local
    // elapsed time is reported at once.
    if(!R.go||R.lock||el()>=R.D)return;
    n.textContent=++R.total;
    if(R.T&&R.total>=R.T){R.lock=1;R.fin=Math.round(el());vib([100,60,100]);say("完成！等待其他玩家…");$("t").textContent=sec(R.fin);report()}
  }else{
    n.textContent=++count;
    var now=Date.now();
    if(joined&&now-lastWarm>=150){lastWarm=now;send({type:"warmup"})}
  }
  n.className="p";setTimeout(function(){n.className=""},80);
}

// Round. countdown.startAt is already on this phone's clock (the server
// converts it using the measured clock offset), so Date.now() decides the
// start; from then on elapsed time comes from the monotonic
// performance.now(). Counting hard-locks at durationMs, and the cumulative
// total is sent every 150 ms until the result arrives, so a lost packet
// never loses shakes.
var cfg=null,R=null;
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}
function el(){return performance.now()-R.p0}
function lobby(){
  $("t").textContent="";$("n").textContent=count;
  say("已加入！搖一搖手機暖身，等待主持人開始…");
  if(cfg)$("mode").textContent=cfg.target?"個人競速 "+cfg.target+" 下（上限 "+cfg.timeCapMs/1000+" 秒）":"個人限時 "+cfg.durationMs/1000+" 秒";
}
function sec(ms){return(ms/1000).toFixed(2)+"s"}
function begin(m){
  if(R){clearInterval(R.iv);prev=R}
  // Resuming after a reconnect: keep the larger of the server's and our own
  // count, since shakes made while offline were never sent, and a race
  // finish either side knows of.
  var t=m.totalShakes||0,f=m.finishedMs||0;
  if(prev&&Math.abs(prev.S-m.startAt)<2000){t=Math.max(t,prev.total);f=f||prev.fin}
  prev=null;
  // Race: D is the time cap and T the target; timed: D is the duration.
  R={S:m.startAt,D:m.durationMs||m.timeCapMs,T:m.target||0,fin:f,total:t,go:0,lock:f?1:0,res:0,sent:0};
  $("n").textContent=t;say("準備…");if(f)$("t").textContent=sec(f);
  R.iv=setInterval(loop,30);loop();
}
function loop(){
  var now=Date.now();
  if(!R.go){
    if(now<R.S){$("t").textContent=Math.ceil((R.S-now)/1000);return}
    R.go=1;R.p0=performance.now()-(now-R.S);if(!R.fin){vib(200);say("搖！用力搖！")}else say("完成！等待其他玩家…");
  }
  var e=el();
  if(!R.lock&&e>=R.D){R.lock=1;vib([100,60,100]);say("時間到！結算中…")}
  if(!R.fin)$("t").textContent=R.lock?"":R.T?R.T-R.total:Math.ceil((R.D-e)/1000);
  if(e-R.sent>=150)report();
}
function report(){
  var e=el();R.sent=e;
  send(R.fin?{type:"progress",totalShakes:R.total,elapsedMs:R.fin,finished:true}:{type:"progress",totalShakes:R.total,elapsedMs:Math.round(Math.min(e,R.D))});
}
function noSensor(){warn("⚠️ 偵測不到動作感應器。請確認使用 HTTPS 連結開啟，或改用其他手機。")}
function arm(){
  if(!window.DeviceMotionEvent){noSensor();return}
  addEventListener("devicemotion",onMotion);
  setTimeout(function(){if(!seen)noSensor()},3000);
}

// Keep the screen awake; failure (unsupported, denied) is tolerated. The
// lock is dropped when the page is hidden, so re-request on return.
function wake(){try{navigator.wakeLock.request("screen").catch(function(){})}catch(_){}}
document.addEventListener("visibilitychange",function(){if(joined&&document.visibilityState=="visible")wake()});

// ready enables the sensor; on iOS 13+ requestPermission must be called
// inside a tap handler.
var arming=0,ios=window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission=="function";
function ready(){
  arming=1;
  if(ios){
    DeviceMotionEvent.requestPermission().then(function(s){
      if(s=="granted")arm();
      else warn("⚠️ 未允許動作感應，無法計算搖動。請關閉 Safari 分頁後重新開啟此頁，並在提示時按「允許」。");
    },noSensor);
  }else arm();
  wake();
}
$("go").onclick=function(){
  // Rejoined from a stored playerId: the tap only enables the sensor.
  if(me&&nick&&ws){$("form").className="hide";ready();return}
  var n=$("name").value.trim();
  if(n.length<1||[...n].length>8){say("暱稱需為 1–8 個字");return}
  // Blur first so shaking can't trigger iOS Shake-to-Undo on the input.
  $("name").blur();
  $("go").disabled=true;
  ready();
  say("連線中…");
  connect(n);
};
// A stored player reconnects straight away; iOS still needs one tap for
// the sensor.
if(me&&nick){
  $("name").value=nick;$("name").className="hide";$("go").textContent="繼續";$("go").disabled=false;
  if(!ios)ready();
  say("重新連線中…");
  connect(nick);
}
</script>
</body>
</html>
